name: Typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck preflight-schema
        run: npx tsc -p packages/preflight-schema/tsconfig.json --noEmit

      - name: Typecheck worker
        run: npx tsc -p workers/evm/tsconfig.json --noEmit

      - name: Typecheck mcp
        run: npx tsc -p mcp/tsconfig.json --noEmit
