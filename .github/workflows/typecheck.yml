name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      INDEXER_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (all workspaces, incl. test files)
        run: npm run typecheck
      - name: Test (all workspaces)
        run: npm run test
      - name: Lint mcp
        run: npm run lint -w @preflight/mcp
      # PH-4: integrarea pe Redis REAL nu e in `npm run test` (suita unitara ramane infra-free). Pas dedicat care
      # foloseste serviciul redis de mai sus. Modulul din integration-down pointeaza pe portul INCHIS 6390 (nimic nu
      # asculta acolo pe runner) -> dovedeste fail-closed unreachable; PH4_LIVE_REDIS_URL = redis-ul real pentru seed.
      - name: PH-4 refresh integration (real Redis)
        env:
          REDIS_URL: redis://localhost:6379
          PH4_LIVE_REDIS_URL: redis://localhost:6379
          PH4_INTEGRATION_ALLOW: '1'
          QUOTA_INTEGRATION_ALLOW: '1'
        run: npm run test:integration -w @preflight/mcp